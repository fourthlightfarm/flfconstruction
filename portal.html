<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Customer Portal | Fourth Light Farm Construction</title>
  <style>
    :root { --brown:#3e2c1f; --green:#8a9b7a; --sage:#b8c5a8; --tan:#e8e3d5; --cream:#f5f2ea; --ink:#2b2423; --red:#a33a2b; --ok:#2f5a2b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--cream); color:var(--ink); }
    main { max-width:720px; margin:0 auto; padding:18px 14px 50px; }
    header { text-align:center; margin-bottom:10px; }
    header img { max-width:210px; width:55%; height:auto; }
    h1 { font-size:20px; margin:4px 0 0; color:var(--brown); }
    h2 { font-size:16px; margin:0 0 10px; color:var(--brown); }
    .card { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.12); padding:16px; margin-top:14px; }
    label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; color:var(--brown); }
    input, select, textarea { width:100%; font:inherit; font-size:16px; padding:11px; border:1px solid #b9b2a2; border-radius:8px; background:#fff; color:var(--ink); }
    textarea { min-height:90px; resize:vertical; }
    button { font:inherit; font-size:16px; font-weight:700; border:0; border-radius:10px; cursor:pointer; background:var(--brown); color:#fff; padding:12px 16px; min-height:46px; }
    button.full { width:100%; margin-top:12px; }
    button.small { min-height:34px; padding:6px 12px; font-size:13px; background:transparent; color:var(--brown); border:1.5px solid var(--brown); }
    button.pay, a.pay { display:inline-block; background:var(--green); color:#fff; text-decoration:none; font-weight:700; border-radius:8px; padding:8px 14px; font-size:14px; }
    button:disabled { opacity:.55; cursor:default; }
    #banner { display:none; margin-top:12px; padding:12px 14px; border-radius:8px; font-weight:600; }
    #banner.ok { display:block; background:#e3f0e1; color:var(--ok); }
    #banner.err { display:block; background:#f7e2de; color:var(--red); }
    .stage { display:inline-block; background:var(--sage); color:var(--brown); padding:4px 14px; border-radius:14px; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:10px; }
    .stat { background:var(--tan); border-radius:8px; padding:10px; text-align:center; }
    .stat b { display:block; font-size:19px; color:var(--brown); }
    .stat span { font-size:12px; color:#6b6359; }
    .row { padding:11px 0; border-bottom:1px solid #eee; }
    .row:last-child { border-bottom:0; }
    .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .muted { color:#6b6359; font-size:13px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700; white-space:nowrap; }
    .Paid { background:#dcebd6; color:#2f5a2b; } .Pending { background:#f5e6b3; color:#6b4e00; } .Not-paid { background:#f7e2de; color:#a33a2b; }
    .flagbox { margin-top:8px; padding:10px; background:var(--cream); border-radius:8px; }
    .reply { margin-top:6px; padding:8px 10px; background:#e3f0e1; border-radius:8px; font-size:14px; }
    h2.group { margin:22px 2px 0; font-size:17px; }
    details.job { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.12); margin-top:12px; }
    details.job > summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    details.job > summary::-webkit-details-marker { display:none; }
    details.job > summary b { font-size:17px; color:var(--brown); }
    details.job > summary::after { content:'\25BE'; color:var(--brown); font-size:18px; }
    details.job[open] > summary::after { content:'\25B4'; }
    .jobbody { padding:0 16px 16px; }
    .jobbody h3 { font-size:15px; margin:16px 0 4px; color:var(--brown); }
    .stage.done { background:var(--tan); }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <img src="logo.png" alt="Fourth Light Farm Construction, LLC">
    <h1>Customer portal</h1>
  </header>

  <div id="banner" role="status"></div>

  <section id="login" class="card">
    <h2>Sign in</h2>
    <form id="loginForm" autocomplete="off">
      <div id="nameRow">
        <label for="nameIn">Your name</label>
        <input id="nameIn" type="text" maxlength="80" autocomplete="name" placeholder="As it appears on your invoice">
      </div>
      <label for="pin">Your 6-digit PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required>
      <button type="submit" class="full" id="loginBtn">View my project</button>
    </form>
  </section>

  <div id="app" hidden>
    <section class="card">
      <h2 id="hello">Hello</h2>
      <p class="muted" style="margin:0">All of your jobs together</p>
      <div class="grid">
        <div class="stat"><b id="sCosts">$0.00</b><span>Project costs so far</span></div>
        <div class="stat"><b id="sInv">$0.00</b><span>Invoiced</span></div>
        <div class="stat"><b id="sPaid">$0.00</b><span>Paid</span></div>
        <div class="stat"><b id="sUnpaid">$0.00</b><span>Still due</span></div>
      </div>
    </section>

    <div id="activeWrap">
      <h2 class="group">Jobs in progress</h2>
      <div id="jobsActive"></div>
    </div>
    <div id="doneWrap">
      <h2 class="group">Completed jobs</h2>
      <div id="jobsDone"></div>
    </div>

    <section class="card">
      <h2>Send us a message</h2>
      <form id="generalForm">
        <label for="gType">This is a</label>
        <select id="gType"><option>Question</option><option>Flag</option></select>
        <label for="gText">Message</label>
        <textarea id="gText" maxlength="1000"></textarea>
        <button type="submit" class="full">Send</button>
      </form>
    </section>

    <section class="card"><h2>Your messages</h2><div id="messages"></div></section>

    <p class="muted" style="text-align:center;margin-top:16px">Questions? Call <a href="tel:+16032651380">(603) 265-1380</a>.</p>
    <button type="button" class="small" id="logout" style="display:block;margin:14px auto 0">Sign out</button>
  </div>
</main>

<script>
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIpw5AZRQRBiFH3PYEdqzyKQlK5oIWLYQBtKc16IDFqXxhHheYxkjRCMt2pLC8Ip0Q/exec';
  var cust = '';
  var custName = '';
  var pin = '';

  function $(id) { return document.getElementById(id); }
  function money(n) { return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDay(ymd) {
    if (!ymd) return '';
    var p = String(ymd).split('-');
    if (p.length !== 3) return ymd;
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function banner(msg, kind) {
    var b = $('banner');
    if (!msg) { b.className = ''; b.textContent = ''; return; }
    b.textContent = msg;
    b.className = kind === 'ok' ? 'ok' : 'err';
  }
  function busy(on) {
    var btns = document.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = on;
  }
  function api(payload) {
    if (SCRIPT_URL.indexOf('http') !== 0) return Promise.reject(new Error('The portal is not connected yet.'));
    if (custName) payload.name = custName; else payload.c = cust;
    payload.pin = pin;
    return fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
  }

  function flagBox(ref, label) {
    var wrap = el('div');
    var btn = el('button', 'Flag or ask about this', 'small');
    btn.type = 'button';
    var box = el('div', null, 'flagbox');
    box.hidden = true;
    var sel = el('select');
    ['Question', 'Flag'].forEach(function (t) { var o = el('option', t); sel.appendChild(o); });
    var ta = el('textarea');
    ta.maxLength = 1000;
    ta.placeholder = 'Your message about: ' + label;
    var send = el('button', 'Send', 'full');
    send.type = 'button';
    box.appendChild(sel); box.appendChild(ta); box.appendChild(send);
    btn.addEventListener('click', function () { box.hidden = !box.hidden; });
    send.addEventListener('click', function () {
      if (!ta.value.trim()) { banner('Type your message first.', 'err'); return; }
      run({ action: 'message', ref: ref, type: sel.value, text: ta.value.trim() });
    });
    wrap.appendChild(btn); wrap.appendChild(box);
    return wrap;
  }

  function listInvoices(box, list) {
    if (!list.length) box.appendChild(el('p', 'No invoices yet.', 'muted'));
    list.forEach(function (i) {
      var row = el('div', null, 'row');
      var top = el('div', null, 'top');
      var left = el('div');
      left.appendChild(el('b', 'Invoice ' + i.number + ' - ' + money(i.amount)));
      left.appendChild(el('div', fmtDay(i.date) + (i.note ? ' - ' + i.note : ''), 'muted'));
      top.appendChild(left);
      top.appendChild(el('span', i.status, 'badge ' + i.status.replace(' ', '-')));
      row.appendChild(top);
      if (i.link) {
        var a = el('a', 'Pay this invoice', 'pay');
        a.href = i.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
        var p = el('div'); p.style.marginTop = '8px'; p.appendChild(a); row.appendChild(p);
      }
      var fb = flagBox(i.ref, 'Invoice ' + i.number); fb.style.marginTop = '8px'; row.appendChild(fb);
      box.appendChild(row);
    });
  }

  function listUpdates(box, list) {
    if (!list.length) box.appendChild(el('p', 'No updates yet.', 'muted'));
    list.forEach(function (u) {
      var row = el('div', null, 'row');
      row.appendChild(el('b', u.title));
      row.appendChild(el('div', fmtDay(u.date), 'muted'));
      if (u.details) row.appendChild(el('p', u.details));
      row.appendChild(flagBox(u.ref, u.title));
      box.appendChild(row);
    });
  }

  function listItems(box, list) {
    if (!list.length) box.appendChild(el('p', 'No line items yet.', 'muted'));
    list.forEach(function (x) {
      var row = el('div', null, 'row');
      var top = el('div', null, 'top');
      var left = el('div');
      left.appendChild(el('b', x.category + (x.type && x.type !== 'Original' ? ' (' + x.type + ')' : '')));
      left.appendChild(el('div', x.description + ' - ' + fmtDay(x.date), 'muted'));
      top.appendChild(left);
      top.appendChild(el('b', money(x.amount)));
      row.appendChild(top);
      row.appendChild(flagBox(x.ref, x.description));
      box.appendChild(row);
    });
  }

  function jobCard(j, open) {
    var done = j.status === 'Completed';
    var det = el('details', null, 'job');
    det.open = open;
    var sum = el('summary');
    sum.appendChild(el('b', j.name));
    sum.appendChild(el('span', done ? 'Completed' : (j.stage || 'In progress'), 'stage' + (done ? ' done' : '')));
    det.appendChild(sum);

    var body = el('div', null, 'jobbody');
    if (j.next && !done) body.appendChild(el('p', 'Next step: ' + j.next, 'muted'));
    if (j.updated) body.appendChild(el('p', 'Last updated ' + fmtDay(j.updated), 'muted'));
    var grid = el('div', null, 'grid');
    [['Costs so far', j.summary.costs], ['Invoiced', j.summary.invoiced], ['Paid', j.summary.paid], ['Still due', j.summary.unpaid]].forEach(function (s) {
      var st = el('div', null, 'stat');
      st.appendChild(el('b', money(s[1])));
      st.appendChild(el('span', s[0]));
      grid.appendChild(st);
    });
    body.appendChild(grid);

    body.appendChild(el('h3', 'Invoices'));
    var ib = el('div'); listInvoices(ib, j.invoices); body.appendChild(ib);
    body.appendChild(el('h3', 'Project updates'));
    var ub = el('div'); listUpdates(ub, j.updates); body.appendChild(ub);
    body.appendChild(el('h3', 'Costs and line items'));
    var lb = el('div'); listItems(lb, j.items); body.appendChild(lb);
    det.appendChild(body);
    return det;
  }

  function render(d) {
    $('login').hidden = true;
    $('app').hidden = false;
    $('hello').textContent = 'Hello, ' + d.name;
    $('sCosts').textContent = money(d.summary.costs);
    $('sInv').textContent = money(d.summary.invoiced);
    $('sPaid').textContent = money(d.summary.paid);
    $('sUnpaid').textContent = money(d.summary.unpaid);

    var jobs = d.jobs || [];
    var active = jobs.filter(function (j) { return j.status !== 'Completed'; });
    var finished = jobs.filter(function (j) { return j.status === 'Completed'; });
    var boxA = $('jobsActive'); boxA.innerHTML = '';
    var boxD = $('jobsDone'); boxD.innerHTML = '';
    active.forEach(function (j) { boxA.appendChild(jobCard(j, active.length === 1)); });
    finished.forEach(function (j) { boxD.appendChild(jobCard(j, false)); });
    if (!active.length) boxA.appendChild(el('p', 'No jobs in progress right now.', 'muted'));
    $('doneWrap').hidden = !finished.length;
    var ms = $('messages'); ms.innerHTML = '';
    if (!d.messages.length) ms.appendChild(el('p', 'No messages yet.', 'muted'));
    d.messages.forEach(function (m) {
      var row = el('div', null, 'row');
      row.appendChild(el('b', m.type + ' - ' + (m.about || 'General')));
      row.appendChild(el('div', fmtDay(m.date) + ' - ' + (m.status || 'New'), 'muted'));
      row.appendChild(el('p', m.text));
      if (m.reply) row.appendChild(el('div', 'Reply: ' + m.reply, 'reply'));
      ms.appendChild(row);
    });
  }

  function run(payload) {
    banner('');
    busy(true);
    return api(payload).then(function (d) {
      busy(false);
      if (!d || !d.ok) { banner((d && d.error) || 'Something went wrong. Try again.', 'err'); return null; }
      render(d);
      if (d.notice) banner(d.notice, 'ok');
      return d;
    }).catch(function (e) {
      busy(false);
      banner(e && e.message ? e.message : 'Could not reach the portal. Check your signal and try again.', 'err');
      return null;
    });
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var nm = $('nameIn').value.trim();
    var p = $('pin').value.trim();
    if ($('nameRow').hidden) { nm = ''; }
    else if (!nm) { banner('Enter your name.', 'err'); return; }
    if (!/^\d{6}$/.test(p)) { banner('Enter your 6-digit PIN.', 'err'); return; }
    custName = nm; pin = p;
    run({ action: 'view' }).then(function (d) { if (!d) { pin = ''; custName = ''; } });
  });

  $('generalForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = $('gText').value.trim();
    if (!t) { banner('Type your message first.', 'err'); return; }
    run({ action: 'message', type: $('gType').value, text: t }).then(function (d) { if (d) $('gText').value = ''; });
  });

  $('logout').addEventListener('click', function () {
    pin = '';
    custName = '';
    $('nameIn').value = '';
    $('app').hidden = true;
    $('login').hidden = false;
    $('pin').value = '';
    banner('');
  });

  (function init() {
    var m = /[?&]c=([^&]+)/.exec(location.search);
    if (m) { cust = decodeURIComponent(m[1]).toLowerCase(); $('nameRow').hidden = true; }
  })();
</script>
</body>
</html>
