<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FLFC Office</title>
  <style>
    :root { --brown:#3e2c1f; --green:#5f7452; --sage:#b8c5a8; --tan:#e8e3d5; --cream:#f5f2ea; --ink:#2b2423; --muted:#6b6359; --line:#d9d2c0; --red:#a33a2b; --ok:#2f5a2b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--cream); color:var(--ink); font-size:15px; }
    main { max-width:980px; margin:0 auto; padding:16px 14px 60px; }
    h1 { font-size:22px; margin:0; color:var(--brown); }
    h2 { font-size:17px; margin:0 0 10px; color:var(--brown); }
    h3 { font-size:14px; margin:18px 0 6px; color:var(--brown); text-transform:uppercase; letter-spacing:.05em; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; margin-top:14px; }
    label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; color:var(--brown); }
    input, select, textarea { width:100%; font:inherit; font-size:15px; padding:8px 9px; border:1px solid #b9b2a2; border-radius:6px; background:#fff; color:var(--ink); min-width:0; }
    input[type=checkbox], input[type=radio] { width:auto; }
    .whenRow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; }
    .whenRow input[type=radio] { margin:0; flex:none; width:18px; height:18px; accent-color:var(--brown); }
    .whenRow input[type=datetime-local] { width:auto; flex:0 1 240px; }
    textarea { min-height:70px; resize:vertical; }
    button { font:inherit; font-weight:600; border:0; border-radius:6px; cursor:pointer; background:var(--brown); color:#fff; padding:8px 14px; min-height:38px; }
    button.alt { background:transparent; color:var(--brown); border:1.5px solid var(--brown); }
    button.go { background:var(--green); }
    button.danger { background:var(--red); }
    button.small { min-height:30px; padding:4px 10px; font-size:13px; }
    button:disabled { opacity:.5; cursor:default; }
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .bar select { flex:1 1 220px; width:auto; font-weight:600; }
    .muted { color:var(--muted); font-size:13px; }
    .banner { margin-top:12px; padding:10px 12px; border-radius:6px; font-weight:600; }
    .banner.ok { background:#e3f0e1; color:var(--ok); }
    .banner.err { background:#f7e2de; color:var(--red); }
    .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin:10px 0 4px; }
    .stat { background:var(--tan); border-radius:6px; padding:8px; text-align:center; }
    .stat b { display:block; font-size:16px; color:var(--brown); }
    .stat span { font-size:12px; color:var(--muted); }
    details.job { border:1px solid var(--line); border-radius:8px; margin-top:12px; background:#fff; }
    details.job > summary { cursor:pointer; padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; list-style:none; }
    details.job > summary::-webkit-details-marker { display:none; }
    details.job > summary b { font-size:16px; color:var(--brown); }
    .pill { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:700; background:var(--sage); color:var(--brown); }
    .pill.done { background:var(--tan); }
    .jobbody { padding:0 14px 14px; }
    .line { display:grid; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid #eee; }
    .line.li { grid-template-columns:1.1fr 2fr .9fr .8fr auto auto; }
    .line.iv { grid-template-columns:.9fr .8fr .8fr 1.6fr 1.4fr auto auto; }
    .line.up { grid-template-columns:1.4fr 2.4fr auto auto; }
    @media (max-width:760px) { .line.li, .line.iv, .line.up { grid-template-columns:1fr 1fr; } }
    .show { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); margin:0; font-weight:400; white-space:nowrap; }
    .saved { outline:2px solid var(--green); }
    .msg { padding:10px 0; border-bottom:1px solid #eee; }
    .copybox { background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:10px; margin-top:6px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; }
    .sinv { padding:10px 0; border-bottom:1px solid #eee; }
    .sinv .bar { margin-top:6px; }
    .sinv select { flex:0 1 190px; width:auto; padding:4px 8px; font-size:13px; }
    .logline { display:grid; grid-template-columns:120px 120px 1fr; gap:4px 10px; padding:5px 0; border-bottom:1px solid #f0ece0; font-size:12.5px; }
    .logline b { color:var(--brown); }
    @media (max-width:760px) { .logline { grid-template-columns:1fr; } }
    .pill.warn { background:#f4d9a8; color:#6b3d00; }
    .files { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin:8px 0; }
    .tile { border:1px solid var(--line); border-radius:8px; padding:6px; background:var(--cream); display:flex; flex-direction:column; gap:4px; min-width:0; }
    .tile .pic { height:96px; border-radius:6px; background:var(--tan); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; font-weight:700; color:var(--brown); font-size:15px; text-transform:uppercase; }
    .tile .pic img { width:100%; height:100%; object-fit:cover; display:block; }
    .tile .nm { font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tile .bar { gap:6px; }
    .lightbox { position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(20,14,10,.88); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; }
    .lightbox img { max-width:100%; max-height:78vh; border-radius:6px; background:#fff; }
    .lightbox .nm { color:#fff; font-weight:600; overflow-wrap:anywhere; text-align:center; }
    /* Tools tab */
    .tl-dd { position:relative; display:inline-block; }
    .tl-dd .ddm { position:absolute; top:100%; left:0; z-index:30; margin-top:4px; background:#fff; border:1px solid var(--line); border-radius:8px; min-width:220px; padding:4px; box-shadow:0 6px 18px rgba(0,0,0,.18); }
    .tl-dd .ddm button { display:block; width:100%; text-align:left; background:none; color:var(--ink); border:0; border-radius:5px; min-height:34px; padding:6px 10px; font-weight:600; }
    .tl-dd .ddm button:hover { background:var(--tan); }
    #toolTab .bar input[type=search] { flex:1 1 200px; width:auto; }
    .tl-totals { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .tl-chip { background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 12px; font-size:14px; }
    .tl-chip b { font-size:17px; color:var(--brown); }
    details.tl-cat { background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
    details.tl-cat > summary { cursor:pointer; padding:11px 14px; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; list-style:none; }
    details.tl-cat > summary::-webkit-details-marker { display:none; }
    details.tl-cat > summary::before { content:'\25B8'; color:var(--muted); }
    details.tl-cat[open] > summary::before { content:'\25BE'; }
    details.tl-cat > summary h2 { margin:0; }
    .tl-count { font-size:12.5px; color:var(--muted); margin-left:auto; }
    .tl-count b { color:#b4691f; }
    .tl-items { padding:0 14px 12px; }
    .tl-items h3 { margin:12px 0 4px; font-size:12px; border-bottom:1px solid var(--line); padding-bottom:3px; }
    .tl-note { background:#fbf1e3; color:#7a4a10; border-radius:6px; padding:8px 12px; font-size:13px; margin:8px 0 2px; }
    .tl-item { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid #f0ece0; }
    .tl-st { flex:0 0 auto; width:70px; background:#fff; color:var(--muted); border:1.5px solid var(--line); border-radius:6px; padding:3px 0; font-size:12.5px; min-height:0; }
    .tl-st.have { background:#e3f0e1; border-color:var(--green); color:var(--green); }
    .tl-st.need { background:#fbe9d3; border-color:#b4691f; color:#7a4a10; }
    .tl-nm { flex:1 1 auto; min-width:0; }
    .tl-nm .n { font-weight:600; }
    .tl-nm .d { display:block; font-size:12.5px; color:var(--muted); }
    .tl-item.have .n { color:var(--green); }
    .tl-del { flex:0 0 auto; background:none; color:var(--red); border:0; min-height:0; padding:2px 8px; font-size:17px; }
    .tl-add { display:flex; gap:8px; margin-top:10px; }
    .tl-add input { flex:1; }
    /* Overhead tab */
    #ohTab table { width:100%; border-collapse:collapse; }
    #ohTab th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:3px 4px; }
    #ohTab td { padding:3px; vertical-align:middle; }
    #ohTab td input, #ohTab td select { padding:5px 6px; font-size:14px; }
    #ohTab td select { min-width:92px; }
    #ohTab .num { text-align:right; }
    #ohTab .stats { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
    /* Estimator tab */
    #estTab .sub { margin-top:14px; }
    #estTab table { width:100%; border-collapse:collapse; }
    #estTab th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:3px 4px; }
    #estTab td { padding:3px; vertical-align:middle; }
    #estTab td input, #estTab td select { padding:5px 6px; font-size:14px; }
    #estTab .num { text-align:right; }
    #estTab .tblwrap { overflow-x:auto; }
    #estTab .totals { display:grid; grid-template-columns:1fr auto; gap:4px 16px; max-width:440px; margin-left:auto; }
    #estTab .totals div:nth-child(even) { text-align:right; font-variant-numeric:tabular-nums; }
    #estTab .totals .big { font-size:18px; font-weight:700; color:var(--brown); border-top:2px solid var(--brown); padding-top:6px; margin-top:4px; }
    #estTab .tk { display:grid; grid-template-columns:1fr 290px; gap:12px; align-items:start; }
    @media (max-width:860px) { #estTab .tk { grid-template-columns:1fr; } }
    #estTab .tools { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
    #estTab .stage { border:1px solid var(--sage); background:#6f6f6f; border-radius:8px; overflow:auto; height:60vh; min-height:340px; }
    #estTab .stage .wrap { position:relative; display:inline-block; line-height:0; }
    #estTab .stage canvas { display:block; }
    #estTab #e-ov { position:absolute; left:0; top:0; cursor:crosshair; }
    #estTab #e-ov.pan { cursor:grab; }
    #estTab .drop { color:#ddd; padding:36px 20px; text-align:center; line-height:1.5; font-size:14px; }
    #estTab .meas { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; background:#fff; }
    #estTab .meas .top { display:flex; gap:6px; align-items:center; }
    #estTab .meas .top input { flex:1; padding:4px 6px; font-size:14px; }
    #estTab .meas .val { font-weight:700; color:var(--brown); white-space:nowrap; }
    #estTab .meas .add { display:flex; gap:6px; margin-top:6px; }
    #estTab .meas .add select { flex:1; padding:4px; font-size:13px; }
    #estTab .calbox { background:#fbf1e3; border:1px solid #e6c796; border-radius:8px; padding:8px; margin-top:8px; }
    #estTab .rowf { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
    #estTab .rowf > div { flex:1 1 120px; }
    #estTab .rowf > .fix { flex:0 0 auto; }
    #estTab .rowf label { margin-top:0; }
    .estQuote { border:1px solid var(--line); border-radius:8px; padding:20px 22px; background:#fff; max-width:780px; }
    .estQuote table { width:100%; border-collapse:collapse; }
    .estQuote th, .estQuote td { padding:6px 8px; border-bottom:1px solid var(--tan); text-align:left; }
    .estQuote .r { text-align:right; }
    .estQuote tr.total td { font-weight:700; font-size:17px; border-top:2px solid var(--brown); border-bottom:0; }
    body.estprint .estQuote { border:0; padding:0; max-width:none; }
    #printRoot { display:none; }
    @media print {
      body.estprint main { display:none !important; }
      body.estprint #printRoot { display:block !important; }
      body.estprint { background:#fff; }
    }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <h1>FLFC Office</h1>
  <p class="muted" style="margin:2px 0 0">Private. Customers, jobs, line items, invoices and messages for the customer portal.</p>
  <div id="banner" class="banner" hidden></div>

  <section id="login" class="card">
    <h2>Sign in</h2>
    <form id="loginForm" autocomplete="off">
      <label for="key">Admin key</label>
      <input id="key" type="password" autocomplete="off" placeholder="Paste your admin key">
      <label class="show" style="margin-top:10px"><input id="remember" type="checkbox"> Remember on this device</label>
      <button type="submit" class="go" style="margin-top:12px;width:100%">Open the office</button>
    </form>
  </section>

  <div id="app" hidden>
    <div class="bar" style="margin-top:14px">
      <button id="tabCust" class="go">Customers</button>
      <button id="tabOut" class="alt">Outreach</button>
      <button id="tabEst" class="alt">Estimator</button>
      <button id="tabOh" class="alt">Overhead</button>
      <span class="tl-dd"><button id="tabTool" class="alt">Tools &#9662;</button><div class="ddm" id="ddTool" hidden></div></span>
    </div>
    <div id="custTab">
    <div class="card bar">
      <select id="cust" aria-label="Customer"></select>
      <button id="btnNew" class="go">New customer</button>
      <button id="btnMsgs" class="alt">Messages <span id="msgCount"></span></button>
      <button id="btnOut" class="alt">Sign out</button>
    </div>

    <section id="newCard" class="card" hidden>
      <h2>New customer</h2>
      <form id="newForm" autocomplete="off">
        <div class="grid2">
          <div><label for="nName">Customer name <span class="muted">(they sign in with this)</span></label><input id="nName" maxlength="80"></div>
          <div><label for="nPhone">Phone number</label><input id="nPhone" maxlength="30"></div>
          <div><label for="nEmail">Email</label><input id="nEmail" maxlength="120"></div>
          <div><label for="nAddr">Address</label><input id="nAddr" maxlength="160"></div>
          <div><label for="nJob">First job <span class="muted">(optional)</span></label><input id="nJob" maxlength="80"></div>
          <div><label for="nPin">Portal PIN <span class="muted">(you choose it)</span></label>
            <div class="bar" style="flex-wrap:nowrap"><input id="nPin" inputmode="numeric" maxlength="6" placeholder="6 digits"><button type="button" class="alt small" id="nRand">Random</button></div></div>
        </div>
        <div class="bar" style="margin-top:12px"><button type="submit" class="go">Add customer</button><button type="button" class="alt" id="nCancel">Cancel</button></div>
      </form>
      <div id="sendBox" hidden>
        <h3>Send to the customer</h3>
        <div class="copybox" id="welcome"></div>
        <button class="alt small" id="copyWelcome" style="margin-top:6px">Copy welcome message</button>
        <div class="copybox" id="pinMsg"></div>
        <button class="alt small" id="copyPin" style="margin-top:6px">Copy PIN message (send separately)</button>
      </div>
    </section>

    <section id="msgsCard" class="card" hidden>
      <h2>Messages from customers</h2>
      <div id="msgs"></div>
    </section>

    <div id="custView"></div>
    </div>
    <div id="outTab" hidden></div>
    <div id="estTab" hidden></div>
    <div id="ohTab" hidden></div>
    <div id="toolTab" hidden></div>
  </div>
</main>
<div id="printRoot"></div>

<script>
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIpw5AZRQRBiFH3PYEdqzyKQlK5oIWLYQBtKc16IDFqXxhHheYxkjRCMt2pLC8Ip0Q/exec';
  var key = '';
  var cur = null;
  var openJobs = {};
  var openCard = {};   // which collapsible cards stay open across re-renders
  var syncNote = {};   // last "Check Stripe" result per job

  function $(id) { return document.getElementById(id); }
  function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
  function money(n) { return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function r2(n) { return Math.round(n * 100) / 100; }
  function banner(msg, kind) {
    var b = $('banner');
    if (!msg) { b.hidden = true; return; }
    b.textContent = msg; b.className = 'banner ' + (kind === 'ok' ? 'ok' : 'err'); b.hidden = false;
  }
  function call(op, data) {
    var p = { action: 'admin', key: key, op: op };
    for (var k in (data || {})) p[k] = data[k];
    return fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(p) })
      .then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, error: 'Could not reach the server. Check your signal and try again.' }; });
  }
  var stripeOn = null;
  var MONTHS3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function shortDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? MONTHS3[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10) : (s || '');
  }
  // A message area that sits inside a card, next to the buttons, and also shows at the top.
  function msgBox() {
    var node = el('div', null, 'banner'); node.hidden = true;
    return {
      node: node,
      say: function (text, kind) {
        node.textContent = text || ''; node.className = 'banner ' + (kind === 'ok' ? 'ok' : 'err'); node.hidden = !text;
        banner(text, kind);
        if (text && node.scrollIntoView) { try { node.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }
      }
    };
  }
  // Button that needs two taps within 6 seconds before it runs.
  function twoTap(btn, label, armedLabel, run) {
    var armed = false, t = null;
    function off() { armed = false; clearTimeout(t); btn.textContent = label; btn.classList.remove('danger'); btn.classList.add('alt'); }
    btn.addEventListener('click', function () {
      if (!armed) { armed = true; btn.textContent = armedLabel; btn.classList.remove('alt'); btn.classList.add('danger'); t = setTimeout(off, 6000); return; }
      off(); run();
    });
    return off;
  }
  function randomId() {
    var a = new Uint32Array(3); crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (n) { return n.toString(36); }).join('');
  }
  function randomPin() {
    var a = new Uint32Array(1); crypto.getRandomValues(a);
    return String(100000 + (a[0] % 900000));
  }
  function copyText(text, btn) {
    var done = function () { var t = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = t; }, 1500); };
    try { navigator.clipboard.writeText(text).then(done, function () { banner('Select the text and press Ctrl+C.', 'err'); }); }
    catch (e) { banner('Select the text and press Ctrl+C.', 'err'); }
  }
  function safeStore(set, v) {
    try { if (set) { if (v) localStorage.setItem('flfc_office_key', v); else localStorage.removeItem('flfc_office_key'); } else return localStorage.getItem('flfc_office_key') || ''; } catch (e) { return ''; }
    return '';
  }

  // ---------- sign in ----------
  function signIn(k, remember) {
    key = k;
    banner('');
    return call('getCustomers').then(function (d) {
      if (!d.ok) { key = ''; banner(d.error || 'Could not sign in.', 'err'); return; }
      safeStore(true, remember ? k : '');
      $('login').hidden = true; $('app').hidden = false;
      fillCustomers(d, cur ? cur.customer.id : '');
      if ($('cust').value) loadCustomer($('cust').value);
    });
  }
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var k = $('key').value.trim();
    if (!k) { banner('Paste your admin key first.', 'err'); return; }
    signIn(k, $('remember').checked);
  });
  $('btnOut').addEventListener('click', function () {
    key = ''; cur = null; safeStore(true, '');
    $('app').hidden = true; $('login').hidden = false; $('key').value = ''; $('custView').innerHTML = ''; banner(''); $('outTab').innerHTML = ''; estimatorReset(); showTab('cust');
  });

  function fillCustomers(d, selectId) {
    var s = $('cust'); s.innerHTML = '';
    d.customers.forEach(function (c) {
      var o = el('option', c.name + (c.active ? '' : ' (inactive)')); o.value = c.id; s.appendChild(o);
    });
    if (selectId) s.value = selectId;
    $('msgCount').textContent = d.newMessages ? '(' + d.newMessages + ')' : '';
    if (!d.customers.length) $('custView').innerHTML = '<p class="muted" style="margin-top:14px">No customers yet. Use New customer.</p>';
  }
  function refreshList(selectId) {
    return call('getCustomers').then(function (d) { if (d.ok) fillCustomers(d, selectId || $('cust').value); });
  }
  $('cust').addEventListener('change', function () { loadCustomer(this.value); });

  // ---------- new customer ----------
  $('btnNew').addEventListener('click', function () {
    $('newCard').hidden = !$('newCard').hidden; $('sendBox').hidden = true;
    if (!$('newCard').hidden) { $('nPin').value = ''; $('nName').focus(); }
  });
  $('nCancel').addEventListener('click', function () { $('newCard').hidden = true; });
  $('nRand').addEventListener('click', function () { $('nPin').value = randomPin(); });
  $('nPin').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').substring(0, 6); });
  $('newForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('nName').value.trim(), pin = $('nPin').value.trim();
    if (!name) { banner('Enter the customer name.', 'err'); return; }
    if (!/^\d{6}$/.test(pin)) { banner('The PIN must be exactly 6 digits.', 'err'); return; }
    banner('Adding…', 'ok');

  // Saves one field on change; on success flashes the box and runs onOk (no re-render).
  function saver(input, getValue, send, onOk) {
    input.addEventListener('change', function () {
      var v = getValue();
      send(v).then(function (d) {
        if (!d.ok) { banner(d.error || 'Could not save.', 'err'); return; }
        banner('');
        input.classList.add('saved'); setTimeout(function () { input.classList.remove('saved'); }, 900);
        if (onOk) onOk(v);
      });
    });
    return input;
  }
  function rowField(tab, obj, field, type, extra) {
    var inp;
    if (type === 'select') {
      inp = el('select');
      extra.options.forEach(function (o) { var op = el('option', o); inp.appendChild(op); });
      inp.value = obj[field];
    } else {
      inp = el('input');
      inp.value = type === 'number' ? obj[field] : obj[field];
      if (type === 'number') { inp.type = 'number'; inp.step = '0.01'; }
      if (extra && extra.placeholder) inp.placeholder = extra.placeholder;
    }
    return saver(inp, function () { return type === 'number' ? inp.value : inp.value; },
      function (v) { var f = {}; f[field] = v; return call('setRow', { tab: tab, row: obj.row, id: cur.customer.id, fields: f }); },
      function (v) { obj[field] = type === 'number' ? Number(v) : v; updateTotals(obj.job); });
  }

    var lab = el('label', null, 'show');

      function (v) { return call('setRow', { tab: tab, row: obj.row, id: cur.customer.id, fields: { visible: v } }); },
      function (v) { obj.visible = v; updateTotals(obj.job); });
    return lab;
  }

  var totalEls = {};
  function totalsFor(jobId) {
    var t = { costs: 0, invoiced: 0, paid: 0 };
    cur.items.forEach(function (i) { if (i.job === jobId && i.visible) t.costs += i.amount; });
    cur.invoices.forEach(function (i) { if (i.job === jobId && i.visible) { t.invoiced += i.amount; if (i.status === 'Paid') t.paid += i.amount; } });
    t.due = t.invoiced - t.paid;
    return t;
  }
  function updateTotals(jobId) {
    var e = totalEls[jobId]; if (!e) return;
    var t = totalsFor(jobId);
    e.costs.textContent = money(r2(t.costs)); e.inv.textContent = money(r2(t.invoiced)); e.paid.textContent = money(r2(t.paid)); e.due.textContent = money(r2(t.due));

  // Emails the customer their portal login (optional), the invoice and the Stripe pay link.

  function invoiceMailCard() {

    field('Total due ($)', total);
    var hint = el('div', null, 'muted'); hint.style.marginTop = '4px'; total.parentNode.appendChild(hint);

    function payload(isPreview) {
      return {

        includeWelcome: welcome.checked, includeReview: review.checked, updated: updated.checked, addToPortal: toPortal.checked,

      if (!/^https:\/\/(invoice|pay|buy|checkout)\.stripe\.com\//.test(link.value.trim())) { say('Paste the Stripe pay link (it starts with https://invoice.stripe.com/).', 'err'); return false; }

      disarmVoid(); voidBtn.disabled = true;

        if (!(span > 0)) return { rows: [], notes: ['Enter the span (the length of each joist).'], pcs: 0, buy: 0, lumber: 0, fasten: 0, hrs: 0, items: [], ok: false };
        var js = frStock(span);
        if (js.over) notes.push('Span is longer than 20 ft. Joists need a splice or an engineered joist.');
        row(kind === 'floor' ? 'floor joists' : 'ceiling joists', size, js.len, spaced + extra, true);
        if (kind === 'floor' && o.rim) row('rim / band board', size, longLen, frCeil(2 * run / longLen), false);
        var br = Math.max(0, Math.round(num(o.blockRows)));
        if (br) row('blocking / bridging', size, longLen, frCeil(br * run / longLen), false);
        notes.push('Joist length ' + js.len + "' for a " + span + "' span. Subfloor, hangers and ledgers are not included.");
      } else {
        var rsp = num(o.span), sides = num(o.sides) === 1 ? 1 : 2, pitch = num(o.pitch) || 0, ovh = num(o.overhang);
        if (!(rsp > 0)) return { rows: [], notes: ['Enter the building width (the span).'], pcs: 0, buy: 0, lumber: 0, fasten: 0, hrs: 0, items: [], ok: false };
        var horiz = rsp / sides + ovh / 12, rlen = horiz * Math.sqrt(1 + Math.pow(pitch / 12, 2)), rs = frStock(rlen);
        if (rs.over) notes.push('Rafters are longer than 20 ft. Price them by hand or use trusses.');
        row('rafters', size, rs.len, (spaced + Math.max(0, Math.round(num(o.extra)))) * sides, true);
        if (sides === 2) {
          var ri = Math.min(FR_SIZES.indexOf(size) + 1, FR_SIZES.length - 1);
          row('ridge board', FR_SIZES[ri < 0 ? 0 : ri], longLen, frCeil(run / longLen), false);
        }
        notes.push('Rafter length ' + (Math.round(rlen * 100) / 100) + ' ft along the slope (cut from ' + rs.len + "'). Ridge is one size deeper. Collar ties, ceiling joists, sheathing are not included.");
      }
      var pcs = 0, buy = 0, lumber = 0;
      rows.forEach(function (r) {
        r.buy = frCeil(r.pcs * (1 + waste / 100));
        r.each = Math.round(num(fr.price[r.size]) * r.len * 100) / 100;
        r.cost = Math.round(r.buy * r.each * 100) / 100;
        pcs += r.pcs; buy += r.buy; lumber += r.cost;
      });
      var fasten = Math.round(lumber * num(fr.fasten)) / 100, hrs = Math.round(pcs * num(fr.hrs) * 100) / 100;
      return { rows: rows, notes: notes, pcs: pcs, buy: buy, lumber: Math.round(lumber * 100) / 100, fasten: fasten, hrs: hrs, ok: true, oc: oc, waste: waste, kind: kind };
    }
    // Turn a result into estimate line items (Material rows, a fasteners line, one Labor line).
    function frameItems(res, label, fr, newId) {

        items.push({ id: newId(), cat: 'Material', desc: r.size + " x " + r.len + "' " + r.what + (r.spaced ? ' @ ' + res.oc + '" OC' : '') + lbl + (res.waste ? ' (+' + res.waste + '% waste)' : ''), qty: r.buy, unit: 'pc', price: r.each, starter: st });
      });
      if (res.fasten > 0) items.push({ id: newId(), cat: 'Material', desc: 'Nails, screws, hardware (' + fixFrame(fr).fasten + '% of lumber)' + lbl, qty: 1, unit: 'ls', price: res.fasten, starter: st });
      if (res.hrs > 0) items.push({ id: newId(), cat: 'Labor', desc: 'Framing labor' + lbl + ' (' + res.pcs + ' pieces)', qty: res.hrs, unit: 'hr', price: '', starter: st });
      return items;
    }

    function defaultPrices() { return { labor: 150, markup: 0, cont: 0, dump: 150, travel: 150, cash: 10, card: 3, valid: 30, frame: defaultFrame(), asm: STARTER.map(function (a) { return Object.assign({}, a); }) }; }
    function freshState() { return { estId: '', job: { customer: '', job: '', address: '', date: new Date().toISOString().slice(0, 10), notes: '' }, items: [], takeoff: { file: '', cal: {}, meas: [] }, posted: null }; }
    function fixState(s) {
      if (!s || !Array.isArray(s.items)) return freshState();
      if (!s.job) s.job = freshState().job;
      if (!s.takeoff) s.takeoff = { file: '', cal: {}, meas: [] };

    }
    function fixPrices(p) {
      var d = defaultPrices();
      if (!p || typeof p !== 'object' || !Array.isArray(p.asm)) return d;
      Object.keys(d).forEach(function (k) { if (p[k] == null) p[k] = d[k]; });

    // ----- storage -----
    var priceTimer = null;
    function saveDraft() { lsSet(K_DRAFT, S); }
    function setStatus(msg, bad) { var e = $e('status'); if (e) { e.textContent = msg; e.style.color = bad ? 'var(--red)' : ''; } }
    function savePrices() {
      lsSet(K_PRICES, P);
      clearTimeout(priceTimer);
      setStatus('Saving price list…');
      priceTimer = setTimeout(function () {
        if (!srv) { setStatus('Price list saved on this device only. The backend needs the Estimator update to save it to the office.', true); return; }
        call('estimatorSavePrices', { data: JSON.stringify(P) }).then(function (d) {
          if (d.ok) setStatus('Price list saved to the office.'); else setStatus(d.error || 'Could not save the price list.', true);
        });
      }, 700);
    }
    function loadAll() {
      return call('estimatorGet').then(function (d) {
        if (d && d.ok) {
          srv = true; saved = d.estimates || [];
          if (d.prices) { try { P = fixPrices(JSON.parse(d.prices)); lsSet(K_PRICES, P); } catch (e) {} }
          else if (!P) P = fixPrices(lsGet(K_PRICES, null));
          setStatus('Connected to the office. Price list and saved estimates sync across your devices.');
        } else {
          srv = false; saved = lsGet(K_SAVED, []);
          P = P || fixPrices(lsGet(K_PRICES, null));
          setStatus('Saving on this device only (' + ((d && d.error) || 'backend not updated') + '). Update the Apps Script to save to the office.', true);
        }
      });
    }

    // ----- calculations -----
    function lineTotal(it) {
      var price = (it.cat === 'Labor' && (it.price === '' || it.price == null)) ? P.labor : num(it.price);
      var t = num(it.qty) * price;
      if (it.cat === 'Material') t *= (1 + num(P.markup) / 100);
      return t;
    }
    function calc() {
      var c = { Labor: 0, Material: 0, Dump: 0, Travel: 0, Other: 0, hours: 0 };
      S.items.forEach(function (it) { c[it.cat] = (c[it.cat] || 0) + lineTotal(it); if (it.cat === 'Labor') c.hours += num(it.qty); });
      c.sub = c.Labor + c.Material + c.Dump + c.Travel + c.Other;
      c.cont = c.sub * num(P.cont) / 100;
      c.total = round2(c.sub + c.cont);
      c.cash = round2(c.total * (1 - num(P.cash) / 100));
      c.card = round2(c.total * (1 + num(P.card) / 100));
      c.donation = round2(c.total * 0.10);
      return c;
    }

      var isPdf = /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name);

        if (!confirm('This is a different plan from "' + S.takeoff.file + '". Clear the existing measurements?')) return;
        S.takeoff = { file: f.name, cal: {}, meas: [] };
      }
      S.takeoff.file = f.name;
      saveDraft(); T.pts = []; T.calPts = null; T.page = 1;
      if (isPdf) {
        ensurePdfJs(function () {
          var r = new FileReader();
          r.onload = function () {
            pdfjsLib.getDocument({ data: new Uint8Array(r.result) }).promise.then(function (doc) { T.kind = 'pdf'; T.pdf = doc; T.pages = doc.numPages; T.page = 1; fitAndRender(true); })
              .catch(function () { banner('Could not open that PDF.', 'err'); });
          };
          r.readAsArrayBuffer(f);
        });
        if (!window.pdfjsLib) banner('Loading the PDF reader… choose the file again if nothing appears.', 'ok');
      } else {
        var img = new Image();
        img.onload = function () { T.kind = 'img'; T.img = img; T.pages = 1; T.page = 1; fitAndRender(true); };
        img.onerror = function () { banner('Could not open that image.', 'err'); };
        img.src = URL.createObjectURL(f);
      }
    }

    // ----- quote -----
    function quoteLines() {
      var c = calc(), L = [];
      if ($e('q-detail').checked) {
        S.items.forEach(function (it) { L.push([it.desc || it.cat, num(it.qty) + ' ' + (it.unit || ''), round2(lineTotal(it)), it.cat]); });
        if (c.cont) L.push(['Contingency (' + P.cont + '%)', '', round2(c.cont), 'Other']);
      } else {
        if (c.Labor) L.push(['Labor', round2(c.hours) + ' hrs', round2(c.Labor), 'Labor']);
        if (c.Dump) L.push(['Dump', '', round2(c.Dump), 'Dump']);
        if (c.Material) L.push(['Materials', '', round2(c.Material), 'Material']);
        if (c.Travel) L.push(['Travel', '', round2(c.Travel), 'Travel']);
        if (c.Other) L.push(['Other', '', round2(c.Other), 'Other']);
        if (c.cont) L.push(['Contingency', '', round2(c.cont), 'Other']);
      }
      return L;
    }
    function longDate(s) { var d = s ? new Date(s + 'T12:00:00') : new Date(); return isNaN(d) ? '' : d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); }
    function quoteNo() { return 'EST-' + ((S.job.date || '').replace(/-/g, '') || 'DRAFT'); }
    function validUntil() { var d = S.job.date ? new Date(S.job.date + 'T12:00:00') : new Date(); d.setDate(d.getDate() + num(P.valid)); return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); }
    function quoteHtml() {
      var c = calc(), L = quoteLines();
      return '<h2 style="margin:0">Fourth Light Farm Construction, LLC</h2><div class="muted">(603) 265-1380 &middot; fourthlightfarm@gmail.com &middot; flfconstruction.com</div>' +
        '<div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:14px 0"><div><b>Estimate for</b><br>' + esc(S.job.customer || '(customer)') + '<br>' + esc(S.job.address || '') + '</div>' +
        '<div><b>' + quoteNo() + '</b><br>' + esc(longDate(S.job.date)) + '<br>Valid until ' + esc(validUntil()) + '</div></div>' +
        (S.job.job ? '<p><b>Project:</b> ' + esc(S.job.job) + '</p>' : '') + (S.job.notes ? '<p style="white-space:pre-wrap">' + esc(S.job.notes) + '</p>' : '') +
        '<table><thead><tr><th>Description</th><th>Qty</th><th class="r">Amount</th></tr></thead><tbody>' +
        (L.length ? L.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="r">' + fm(r[2]) + '</td></tr>'; }).join('') : '<tr><td colspan="3" class="muted">No line items yet.</td></tr>') +
        '<tr class="total"><td colspan="2">Total (check / ACH)</td><td class="r">' + fm(c.total) + '</td></tr></tbody></table>' +
        '<p style="margin-top:14px"><b>Payment options</b><br>Check or ACH: ' + fm(c.total) + ' &middot; Cash: ' + fm(c.cash) + ' (' + P.cash + '% off) &middot; Card: ' + fm(c.card) + ' (+' + P.card + '% processing)</p>' +
        '<p class="muted">Financing may be available through our partner, Enhancify. Check your rate at flfconstruction.com/pricing.html. This estimate is based on the scope described above; changes to the scope may change the price.</p>';
    }
    function handoffText() {
      var c = calc();
      return ['Customer: ' + (S.job.customer || '(not set)'), 'Job: ' + (S.job.job || '(not set)'), 'Invoice line item (one line): ' + (S.job.job || 'Services'),
        'Invoice total, check / ACH: ' + fm(c.total), 'Cash price: ' + fm(c.cash) + '    Card price: ' + fm(c.card),
        'Portal breakdown: Labor ' + fm(c.Labor) + ' (' + round2(c.hours) + ' hrs), Dump ' + fm(c.Dump) + ', Material ' + fm(c.Material) + ', Travel ' + fm(c.Travel) + (c.Other ? ', Other ' + fm(c.Other) : '') + (c.cont ? ', Contingency ' + fm(c.cont) : ''),
        'Invoice note: Itemized costs are in the customer portal.'].join('\n');
    }
    function renderQuote() { $e('quote').innerHTML = quoteHtml(); $e('handoff').textContent = handoffText(); $e('hdr').textContent = fm(calc().total); }

    // ----- hand-off to a portal job -----
    var hoCusts = null, hoJobs = {};
    function hmsg(text, kind) { var b = $e('h-msg'); b.textContent = text || ''; b.className = 'banner ' + (kind === 'ok' ? 'ok' : 'err'); b.hidden = !text; }
    function loadHandoffCustomers() {
      if (hoCusts) return;
      call('getCustomers').then(function (d) {
        if (!d.ok) { hmsg(d.error || 'Could not load customers.', 'err'); return; }
        hoCusts = d.customers;
        var sel = $e('h-cust'); sel.innerHTML = '<option value="">Choose a customer…</option>';
        d.customers.forEach(function (c) { var o = el('option', c.name + (c.active ? '' : ' (inactive)')); o.value = c.id; sel.appendChild(o); });
      });
    }
    function loadHandoffJobs(id) {
      var js = $e('h-job'); js.innerHTML = '<option value="">Loading…</option>';
      if (!id) { js.innerHTML = '<option value="">Choose a customer first</option>'; return; }
      call('getCustomer', { id: id }).then(function (d) {
        js.innerHTML = '';
        if (!d.ok) { hmsg(d.error || 'Could not load jobs.', 'err'); return; }
        hoJobs[id] = d.jobs;
        d.jobs.forEach(function (j) { var o = el('option', j.name || j.id); o.value = j.id; js.appendChild(o); });
        if (!d.jobs.length) js.innerHTML = '<option value="">No jobs yet</option>';
      });
    }
    function postToPortal() {
      var cid = $e('h-cust').value, jid = $e('h-job').value;
      if (!cid || !jid) { hmsg('Choose the customer and the job first.', 'err'); return; }
      var L = quoteLines().filter(function (r) { return r[2] > 0; });
      if (!L.length) { hmsg('The estimate has no costs to post.', 'err'); return; }
      var btn = $e('h-post'); btn.disabled = true; hmsg('Adding ' + L.length + ' line item' + (L.length === 1 ? '' : 's') + '…', 'ok');
      var done = 0, label = S.job.job ? S.job.job + ' - ' : '';
      (function next() {
        if (done >= L.length) {
          btn.disabled = false;
          S.posted = { cid: cid, jid: jid, when: new Date().toISOString().slice(0, 10), n: L.length }; saveDraft(); resetPostBtn();
          hmsg('Added ' + L.length + ' line item' + (L.length === 1 ? '' : 's') + ' to the job (' + fm(calc().total) + ' total, check/ACH). Open the customer to invoice from them.', 'ok');
          return;
        }
        var r = L[done];
        call('addLineItem', { id: cid, jobId: jid, category: r[3], description: label + r[0] + (r[1] && r[1].indexOf('hrs') > 0 ? ' (' + r[1] + ')' : ''), type: 'Original', amount: r[2] }).then(function (d) {
          if (!d.ok) { btn.disabled = false; hmsg((done ? 'Stopped after ' + done + ' of ' + L.length + ' lines. ' : '') + (d.error || 'Could not add the line.'), 'err'); return; }
          done++; next();
        });
      })();
    }
    var resetPostBtn = function () {};

    // ----- wiring -----
    function wire() {
      var root = $('estTab');
      $e('sub').addEventListener('click', function (e) { if (e.target.dataset.sub) showSub(e.target.dataset.sub); });
      Object.keys(JOBF).forEach(function (id) { $e(id).addEventListener('input', function (e) { S.job[JOBF[id]] = e.target.value; saveDraft(); }); });
      $e('qa-asm').addEventListener('change', renderAsmSelect);
      $e('qa-add').addEventListener('click', function () {
        if (addAssembly($e('qa-asm').value, num($e('qa-qty').value), num($e('qa-waste').value))) { $e('qa-qty').value = ''; renderEstimate(); toast('Added.'); }
      });
      $$('[data-add]', root).forEach(function (b) { b.addEventListener('click', function () { addBlank(b.dataset.add); }); });
      $e('items').addEventListener('input', function (e) {
        var tr = e.target.closest('tr[data-id]'); if (!tr || !e.target.dataset.f) return;
        var it = S.items.filter(function (x) { return x.id === tr.dataset.id; })[0]; if (!it) return;
        it[e.target.dataset.f] = e.target.value;
        if (e.target.dataset.f === 'cat') { saveDraft(); renderEstimate(); return; }
        tr.querySelector('[data-lt]').textContent = fm(lineTotal(it)); saveDraft(); renderTotals();
      });
      $e('items').addEventListener('click', function (e) {
        if (!e.target.closest('[data-del]')) return;
        var id = e.target.closest('tr').dataset.id; S.items = S.items.filter(function (x) { return x.id !== id; }); saveDraft(); renderEstimate();
      });
      // save / load
      $e('saved').addEventListener('click', function (e) {
        var i = e.target.dataset.open != null ? +e.target.dataset.open : (e.target.dataset.rm != null ? +e.target.dataset.rm : -1);
        if (i < 0 || !saved[i]) return;
        var item = saved[i];
        if (e.target.dataset.open != null) {
          if (srv) call('estimatorLoad', { estimateId: item.id }).then(function (d) {
            if (!d.ok) { banner(d.error, 'err'); return; }
            try { S = fixState(JSON.parse(d.data)); S.estId = item.id; } catch (x) { banner('That estimate could not be read.', 'err'); return; }
            clearPlan(); saveDraft(); renderEstimate(); toast('Opened "' + item.name + '".');
          });
          else { S = fixState(JSON.parse(JSON.stringify(item.state))); S.estId = item.id; clearPlan(); saveDraft(); renderEstimate(); toast('Opened "' + item.name + '".'); }
        } else if (confirm('Delete the saved estimate "' + item.name + '"? This cannot be undone.')) {
          if (srv) call('estimatorDelete', { estimateId: item.id }).then(function (d) { if (!d.ok) { banner(d.error, 'err'); return; } saved.splice(i, 1); renderSaved(); });
          else { saved.splice(i, 1); lsSet(K_SAVED, saved); renderSaved(); }
        }
      });
      $e('save').addEventListener('click', function () {
        var name = $e('save-name').value.trim() || [S.job.customer, S.job.job].filter(Boolean).join(' - ') || 'Untitled';
        if (srv) {
          call('estimatorSave', { estimateId: S.estId || '', name: name, data: JSON.stringify(S) }).then(function (d) {
            if (!d.ok) { banner(d.error || 'Could not save.', 'err'); return; }
            S.estId = d.id; saveDraft(); toast('Saved "' + name + '" to the office.');
            call('estimatorGet').then(function (g) { if (g.ok) { saved = g.estimates; renderSaved(); } });
          });
        } else {
          if (!S.estId) S.estId = uid();
          saved = saved.filter(function (s) { return s.id !== S.estId; });
          saved.unshift({ id: S.estId, name: name, updated: new Date().toLocaleString(), state: JSON.parse(JSON.stringify(S)) });
          lsSet(K_SAVED, saved); saveDraft(); renderSaved(); toast('Saved "' + name + '" on this device.');
        }
      });
      $e('new').addEventListener('click', function () {
        if (S.items.length && !confirm('Start a new estimate? Unsaved changes will be lost.')) return;
        S = freshState(); saveDraft(); clearPlan(); $e('save-name').value = ''; renderEstimate(); renderMeas(); toast('New estimate.');
      });
      // prices
      $e('fp-card').addEventListener('input', frPriceEdit);
      Object.keys(RATES).forEach(function (id) { $e(id).addEventListener('input', function (e) { P[RATES[id]] = num(e.target.value); savePrices(); }); });
      $e('asm').addEventListener('input', function (e) {
        var tr = e.target.closest('tr[data-id]'); if (!tr || !e.target.dataset.f) return;
        var a = asmById(tr.dataset.id); if (!a) return;
        var f = e.target.dataset.f; a[f] = (f === 'hrs' || f === 'mat') ? num(e.target.value) : e.target.value;
        if (a.starter) { a.starter = false; var sp = tr.querySelector('[data-sp]'); if (sp) sp.remove(); }
        savePrices();
      });
      $e('asm').addEventListener('click', function (e) {
        if (!e.target.closest('[data-del]')) return;
        var id = e.target.closest('tr').dataset.id; P.asm = P.asm.filter(function (a) { return a.id !== id; }); savePrices(); fillPrices();
      });
      $e('asm-add').addEventListener('click', function () { P.asm.push({ id: uid(), name: 'New work type', unit: 'SF', hrs: 0, mat: 0, matDesc: '', starter: false }); savePrices(); fillPrices(); });
      $e('asm-reset').addEventListener('click', function () {
        if (!confirm('Replace the work type list with the starter list? Your edits to work types will be lost.')) return;
        P.asm = defaultPrices().asm; savePrices(); fillPrices(); toast('Reset to the starter list.');
      });
      // takeoff
      ctxP = $e('plan').getContext('2d'); ctxO = $e('ov').getContext('2d');
      $e('plan-file').addEventListener('change', function (e) { var f = e.target.files[0]; if (f) openPlan(f); e.target.value = ''; });
      $e('pg-prev').addEventListener('click', function () { if (T.page > 1) { T.page--; T.pts = []; fitAndRender(false); } });
      $e('pg-next').addEventListener('click', function () { if (T.page < T.pages) { T.page++; T.pts = []; fitAndRender(false); } });
      function setZoom(z) { T.zoom = Math.max(0.1, Math.min(6, z)); render(); }
      $e('z-in').addEventListener('click', function () { setZoom(T.zoom * 1.25); });
      $e('z-out').addEventListener('click', function () { setZoom(T.zoom / 1.25); });
      $e('z-fit').addEventListener('click', function () { if (T.kind) fitAndRender(true); });
      $$('#e-sec-takeoff [data-tool]').forEach(function (b) { b.addEventListener('click', function () { setTool(b.dataset.tool); }); });
      var ov = $e('ov');
      ov.addEventListener('click', function (e) {
        if (!T.kind || T.tool === 'pan') return;
        var p = ptFromEvent(e);
        if (T.tool === 'cal') {
          if (!T.calPts || T.calPts.length >= 2) T.calPts = [];
          T.calPts.push(p);
          $e('tool-hint').textContent = T.calPts.length === 1 ? 'Now click the other end.' : 'Type the real length below and press Apply scale.';
          if (T.calPts.length === 2) setTimeout(function () { $e('cal-dist').focus(); }, 0);
        } else {
          if (T.tool !== 'cnt' && T.pts.length) { var l = T.pts[T.pts.length - 1]; if (Math.hypot(l[0] - p[0], l[1] - p[1]) * T.zoom < 3) return; }
          T.pts.push(p);
        }
        drawOverlay();
      });
      ov.addEventListener('dblclick', function (e) { if (T.tool === 'len' || T.tool === 'area') { e.preventDefault(); finishMeasure(); } });
      ov.addEventListener('mousemove', function (e) { if (T.tool === 'len' || T.tool === 'area' || (T.tool === 'cal' && T.calPts && T.calPts.length === 1)) { hover = ptFromEvent(e); drawOverlay(); } });
      ov.addEventListener('mouseleave', function () { hover = null; drawOverlay(); });
      $e('cal-apply').addEventListener('click', function () {
        if (!T.calPts || T.calPts.length < 2) { banner('Click two points on the plan first.', 'err'); return; }
        var ft = parseLen($e('cal-dist').value);
        if (!(ft > 0)) { banner('Type a length like 12\'6" or 12.5', 'err'); return; }
        var d = Math.hypot(T.calPts[0][0] - T.calPts[1][0], T.calPts[0][1] - T.calPts[1][1]);
        S.takeoff.cal[T.page] = d / ft; saveDraft(); $e('cal-dist').value = ''; T.calPts = null;
        updateTkUI(); renderMeas(); toast('Scale set.'); setTool('len');
      });
      $e('cal-preset-apply').addEventListener('click', function () {
        var inch = num($e('cal-preset').value);
        if (!inch) { banner('Choose a printed scale first.', 'err'); return; }
        if (T.kind !== 'pdf') { banner('Printed scales only work on PDFs. Use two points and a known dimension.', 'err'); return; }
        S.takeoff.cal[T.page] = inch * 72; saveDraft(); updateTkUI(); renderMeas(); toast('Scale set from the printed scale.'); setTool('len');
      });
      $e('t-finish').addEventListener('click', finishMeasure);
      $e('t-undo').addEventListener('click', function () { if (T.tool === 'cal' && T.calPts) T.calPts.pop(); else T.pts.pop(); drawOverlay(); });
      $e('t-cancel').addEventListener('click', function () { T.pts = []; T.calPts = null; hover = null; drawOverlay(); });
      document.addEventListener('keydown', function (e) {
        if (!built || $('estTab').hidden || $e('sec-takeoff').hidden) return;
        var tg = e.target.tagName; if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
        if (e.key === 'Enter') finishMeasure();
        if (e.key === 'Escape') { T.pts = []; T.calPts = null; drawOverlay(); }
        if (e.key === 'Backspace') { T.pts.pop(); drawOverlay(); e.preventDefault(); }
      });
      $e('meas').addEventListener('input', function (e) {
        if (e.target.dataset.f !== 'label') return;
        var m = S.takeoff.meas.filter(function (x) { return x.id === e.target.closest('.meas').dataset.id; })[0]; if (m) { m.label = e.target.value; saveDraft(); drawOverlay(); }
      });
      $e('meas').addEventListener('click', function (e) {
        var card = e.target.closest('.meas'); if (!card) return;
        var m = S.takeoff.meas.filter(function (x) { return x.id === card.dataset.id; })[0]; if (!m) return;
        if (e.target.closest('[data-del]')) { S.takeoff.meas = S.takeoff.meas.filter(function (x) { return x !== m; }); saveDraft(); renderMeas(); drawOverlay(); }
        if (e.target.closest('[data-send]')) {
          var v = measValue(m), asm = card.querySelector('[data-asm]').value;
          if (v && addAssembly(asm, round2(v.v), num($e('tk-waste').value), m.label)) toast('Added to the estimate: ' + round2(v.v) + ' ' + v.u);
        }
        if (e.target.closest('[data-frame]')) {
          var fv = measValue(m); if (!fv) return;
          showSub('estimate'); frInit(); fe('run').value = round2(fv.v); fe('label').value = m.label; frRender();
          $e('fr-card').scrollIntoView({ block: 'start' }); toast('Length filled in. Pick the spacing and size.');
        }      });
      // quote
      $e('q-detail').addEventListener('change', renderQuote);
      $e('q-print').addEventListener('click', function () {
        var pr = $('printRoot'); pr.innerHTML = '<div class="estQuote" style="font-family:Segoe UI,Arial,sans-serif;color:#111;padding:10px">' + quoteHtml() + '</div>';
        document.body.classList.add('estprint');
        var clean = function () { document.body.classList.remove('estprint'); pr.innerHTML = ''; window.removeEventListener('afterprint', clean); };
        window.addEventListener('afterprint', clean); window.print();
      });
      function copy(text, btn) { copyText(text, btn); }
      $e('h-copy').addEventListener('click', function () { copy(handoffText(), this); });
      $e('q-copy').addEventListener('click', function () {
        var c = calc();
        copy('Fourth Light Farm Construction, LLC - Estimate ' + quoteNo() + '\n' + (S.job.customer || '') + (S.job.job ? ' - ' + S.job.job : '') + '\n\n' +
          quoteLines().map(function (r) { return r[0] + (r[1] ? ' (' + r[1] + ')' : '') + ': ' + fm(r[2]); }).join('\n') +
          '\n\nTotal (check / ACH): ' + fm(c.total) + '\nCash: ' + fm(c.cash) + '\nCard: ' + fm(c.card) + '\nValid until ' + validUntil(), this);
      });
      $e('h-cust').addEventListener('change', function () { hmsg(''); loadHandoffJobs(this.value); });
      resetPostBtn = twoTap($e('h-post'), 'Add to portal job', 'Tap again: the customer will see these', function () { postToPortal(); });
      $e('h-post').addEventListener('click', function () {
        if (S.posted && S.posted.cid === $e('h-cust').value && S.posted.jid === $e('h-job').value) hmsg('Heads up: this estimate was already added to this job on ' + S.posted.when + '. Adding again will duplicate the lines.', 'err');
      });
      $e('h-open').addEventListener('click', function () {
        var cid = $e('h-cust').value, jid = $e('h-job').value;
        if (!cid) { hmsg('Choose a customer first.', 'err'); return; }
        $('cust').value = cid; if (jid) openJobs[jid] = true;
        loadCustomer(cid).then(function () { showTab('cust'); });
      });
    }

    function build() {
      $('estTab').innerHTML = skeleton();
      built = true; frBuilt = false; wire(); setTool('pan');
    }
    window.estimatorTab = function () {
      if (!S) S = fixState(lsGet(K_DRAFT, null));
      if (!built) { P = P || fixPrices(lsGet(K_PRICES, null)); build(); showSub('estimate'); }
      loadAll().then(function () {
        if (!built || $('estTab').hidden) return;
        renderSaved(); renderAsmSelect(); renderTotals(); renderItems(); frRender();
        if (sub === 'prices') fillPrices();
        if (sub === 'takeoff') renderMeas();
        if (sub === 'quote') renderQuote();
      });
    };
    window.estimatorReset = function () { built = false; srv = null; P = null; S = null; saved = []; hoCusts = null; hoJobs = {}; clearTimeout(priceTimer); $('estTab').innerHTML = ''; clearPlan(); };
  })();

  (function init() {
    var saved = safeStore(false);
    if (saved) { $('key').value = saved; $('remember').checked = true; signIn(saved, true); }
  })();
</script>
