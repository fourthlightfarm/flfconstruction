<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Cow Catapult</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1F3A24; font-family: Arial, Helvetica, sans-serif; }
      #unity-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #6FA84A; }
      #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(#8CC3E6, #6FA84A 70%, #4E8A3A); color: #FFF7DC; transition: opacity 0.4s; }
      #loading h1 { margin: 0 0 18px; font-size: clamp(22px, 5vw, 44px); letter-spacing: 3px; color: #F2B134; text-shadow: 2px 3px 0 #3B2A1E; text-align: center; }
      #tag { margin: -6px 24px 20px; font-size: 16px; text-align: center; color: #FFF7DC; text-shadow: 1px 1px 0 #3B2A1E; }
      #bar { width: min(320px, 60vw); height: 14px; background: #3B2A1E; border-radius: 8px; overflow: hidden; border: 2px solid #3B2A1E; }
      #fill { height: 100%; width: 0; background: #F2B134; }
      #msg { margin: 14px 24px 0; font-size: 16px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>COW CATAPULT</h1>
      <div id="tag">Fourth Light Farm Construction, LLC</div>
      <div id="bar"><div id="fill"></div></div>
      <p id="msg">Loading the cows...</p>
    </div>
    <script src="Build/398594651d26e0a0faba2a7ed7fdc84e.loader.js"></script>
    <script>
      var fill = document.getElementById("fill");
      var loading = document.getElementById("loading");
      var msg = document.getElementById("msg");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/13c162c2d17cf5ad59c01d380fedd81c.data.unityweb",
        frameworkUrl: "Build/3d1eee7343b4fa9f3df940a52db5e435.framework.js.unityweb",
        codeUrl: "Build/54c7a67f7112f81f826d2432561643b7.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Fourth Light Farm Construction",
        productName: "Cow Catapult",
        productVersion: "0.1.0",
      }, function (progress) {
        fill.style.width = (progress * 100) + "%";
      }).then(function () {
        loading.style.opacity = 0;
        setTimeout(function () { loading.style.display = "none"; }, 400);
      }).catch(function (message) {
        msg.textContent = "Sorry, the game could not start. " + message;
      });
    </script>
  </body>
</html>
